name: Publish Docker images
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/eurekai-org/bytewall-api:${{ github.event.release.tag_name }}
            ghcr.io/eurekai-org/bytewall-api:latest

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./bg_workers/Dockerfile
          push: true
          tags: |
            ghcr.io/eurekai-org/bytewall-worker:${{ github.event.release.tag_name }}
            ghcr.io/eurekai-org/bytewall-worker:latest

services:
  migrate:
    image: ${API_IMAGE_REGISTRY}
    env_file:
      - .env

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  api:
    image: ${API_IMAGE_REGISTRY}
    env_file:
      - .env

    command:
      - fastapi
      - run
      - --port=8080

    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-2G}

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      migrate:
        condition: service_completed_successfully

      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  workers_default:
    image: ${WORKERS_IMAGE_REGISTRY}
    env_file:
      - .env

    environment:
      S3_BUCKET_NAME: ${S3_SANITIZED_BUCKET_NAME}

    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - -l
      - INFO
      - -Q
      - default
      - --concurrency
      - "1"
      - --prefetch-multiplier
      - "1"
      - -O
      - fair
      - -n
      - default_worker@%h

    restart: unless-stopped
    mem_limit: ${DEFAULT_WORKERS_MEM_LIMIT:-2G}

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  workers_scan:
    image: ${WORKERS_IMAGE_REGISTRY}
    env_file:
      - .env

    environment:
      S3_BUCKET_NAME: ${S3_SANITIZED_BUCKET_NAME}

    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - -l
      - INFO
      - -Q
      - scan
      - --concurrency
      - "1"
      - --prefetch-multiplier
      - "1"
      - -O
      - fair
      - -n
      - scan_worker@%h

    restart: unless-stopped
    mem_limit: ${SCAN_WORKERS_MEM_LIMIT:-2G}

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      clamav:
        condition: service_healthy

  workers_beat:
    image: ${WORKERS_IMAGE_REGISTRY}
    env_file:
      - .env

    environment:
      S3_BUCKET_NAME: ${S3_SANITIZED_BUCKET_NAME}

    command:
      - celery
      - -A
      - celery_app:celery_app
      - worker
      - -l
      - INFO
      - -Q
      - beat
      - --concurrency
      - "1"
      - --prefetch-multiplier
      - "1"
      - -O
      - fair
      - -n
      - beat_worker@%h

    restart: unless-stopped
    mem_limit: ${BEAT_WORKERS_MEM_LIMIT:-2G}

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  beat:
    image: ${WORKERS_IMAGE_REGISTRY}
    env_file:
      - .env

    environment:
      S3_BUCKET_NAME: ${S3_SANITIZED_BUCKET_NAME}

    command:
      - celery
      - -A
      - celery_app:celery_app
      - beat
      - -l
      - INFO

    restart: unless-stopped

    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bytewall}
      POSTGRES_USER: ${POSTGRES_USER:-bytewall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-bytewall} -d ${POSTGRES_DB:-bytewall}
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD}
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-bytewall}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable

    restart: unless-stopped

    volumes:
      - clamav_data:/var/lib/clamav

    mem_limit: ${CLAMAV_MEM_LIMIT:-4G}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
